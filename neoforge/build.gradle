plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}


tasks.register('exportTestLaunch') {
    def gameRuns = ['client','server'].collect { tasks.named('run' + it.capitalize()).get() }
    dependsOn gameRuns.collectMany { it.taskDependencies.getDependencies(it) }
    doLast {
        gameRuns.each { run ->
            def side = run.name.substring(3).toLowerCase()
            def cp = (run.hasProperty('classpathProvider') ? run.classpathProvider : run.classpath)
            def jvm = run.jvmArgs + run.jvmArgumentProviders.collectMany { it.asArguments() as List }
            def args = run.args + run.argumentProviders.collectMany { it.asArguments() as List }
            def out = [classpath: cp.files.findAll { it.isFile() && it.name.endsWith('.jar') }.collect { it.absolutePath },
                jvm: jvm, args: args, main: run.mainClass.get(), environment: (run.hasProperty('environmentProperty') ? run.environmentProperty.get() : [:])]
            file("${buildDir}/test-${side}.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(out))
        }
    }
}
